(function(){

var DB_NAME='chanlai_pt_v9_db',DB_VERSION=4,PAGE_SIZE=100,db=null;
var stores=['words','phrases','sentences','stories','novels','review','stats','snapshots','trash'];
var menu=[
['home','首页'],
['words','单词表（词卡）'],
['phrases','短语库'],

['stories','故事库'],

];var state={module:'words',page:{words:1,phrases:1,sentences:1,stories:1,novels:1,all:1},query:'',filter:'',cat1:'',cat2:'',cat3:'',difficulty:'',current:null,importPreview:[],playQueue:[],playIndex:0,isPlaying:false,voices:[]};
var quickCurrent = null;

var SETTINGS_KEY='chanlai_pt_v9_settings',DRAFT_KEY='chanlai_pt_v9_draft',SAMPLE_SEED_DISABLED_KEY='chanlai_disable_sample_seed';
function openDB(){return new Promise(function(resolve,reject){var req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=function(e){var d=e.target.result;stores.forEach(function(s){if(!d.objectStoreNames.contains(s)){var os=d.createObjectStore(s,{keyPath:'id'});os.createIndex('module','module',{unique:false});os.createIndex('cat1','cat1',{unique:false});os.createIndex('hidden','hidden',{unique:false});os.createIndex('favorite','favorite',{unique:false});}});};req.onsuccess=function(){db=req.result;resolve(db);};req.onerror=function(){reject(req.error);};});}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);} 
function reqPromise(req){return new Promise(function(resolve,reject){req.onsuccess=function(){resolve(req.result);};req.onerror=function(){reject(req.error);};});}
function putMany(store,items,onProgress){return new Promise(function(resolve,reject){var batch=200,i=0,total=items.length;function step(){var chunk=items.slice(i,i+batch);var tr=db.transaction(store,'readwrite');var os=tr.objectStore(store);chunk.forEach(function(it){os.put(it);});tr.oncomplete=function(){i+=chunk.length;if(onProgress)onProgress(i,total);if(i<total)setTimeout(step,0);else resolve();};tr.onerror=function(){reject(tr.error);};}step();});}
function clearStore(store){return reqPromise(tx(store,'readwrite').clear());}
function getCount(store){return reqPromise(tx(store,'readonly').count());}
function getAll(store){return reqPromise(tx(store,'readonly').getAll());}
function getOne(store,id){return reqPromise(tx(store,'readonly').get(id));}
function putOne(store,item){return reqPromise(tx(store,'readwrite').put(item));}
function delOne(store,id){return reqPromise(tx(store,'readwrite').delete(id));}

        goalLearn:100,

    };
}
function loadSettings(){var s=defaultSettings();try{Object.assign(s,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'));Object.assign(s,JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}'));}catch(e){}return s;}
function matchLearningPath(item){
    var s = loadSettings();

    var current = String(
        s.learningPath || 'COMM6M'
    ).toUpperCase();

    var path = String(
        item.learningPath ||
        item.LEARNING_PATH ||
        'MASTER'
    ).toUpperCase();

    if(
        path !== 'COMM6M' &&
        path !== 'NATIVE' &&
        path !== 'MASTER'
    ){
        path = 'MASTER';
    }

    if(current === 'MASTER'){
        return true;
    }

    if(current === 'NATIVE'){
        return (
            path === 'COMM6M' ||
            path === 'NATIVE'
        );
    }

    return path === 'COMM6M';
}
window.matchLearningPath = matchLearningPath;
async function addTestLearningPath(){
    var modules = ['words','phrases','sentences','stories','novels'];

    for(var i=0;i<modules.length;i++){
        var rows = await getAll(modules[i]);

        for(var j=0;j<rows.length;j++){
            var x = rows[j];

            if(j % 3 === 0){
                x.learningPath = 'COMM6M';
            }else if(j % 3 === 1){
                x.learningPath = 'NATIVE';
            }else{
                x.learningPath = 'MASTER';
            }

            await putOne(modules[i],x);
        }
    }

    alert('测试学习路线已写入：COMM6M / NATIVE / MASTER');
}
window.addTestLearningPath = addTestLearningPath;
function applySettings(s){document.documentElement.style.setProperty('--main',s.themeColor||'#2563eb');document.documentElement.style.setProperty('--bg',s.bgColor||'#f5f7fb');var fm={'超小':'12px','小':'14px','中':'16px','大':'18px','超大':'22px'};document.documentElement.style.setProperty('--font',fm[s.fontSize]||'16px');if(s.appearance==='深色'){document.documentElement.style.setProperty('--card','#111827');document.documentElement.style.setProperty('--text','#e5e7eb');document.documentElement.style.setProperty('--line','#374151');document.documentElement.style.setProperty('--muted','#9ca3af');}else{document.documentElement.style.setProperty('--card','#fff');document.documentElement.style.setProperty('--text','#172033');document.documentElement.style.setProperty('--line','#dce3ef');document.documentElement.style.setProperty('--muted','#667085');}}
async function seedIfEmpty(){if(localStorage.getItem(SAMPLE_SEED_DISABLED_KEY)==='1')return;var c=await getCount('words');if(c>0)return;var sample={words:[wordItem('ser','是；身份；本质；长期属性','ser 表示身份、职业、来源、长期性质。','核心动词','身份属性','基础表达','动词','现在时: eu sou=我是；você é=你是；ele/ela é=他/她是；a gente é=我们是（口语）；nós somos=我们是 | 过去时: eu fui=我曾是；você foi=你曾是；ele/ela foi=他/她曾是 | 未来: vou ser=我会成为/我会是；você vai ser=你会是','Eu sou chinês.=我是中国人。；Ela é advogada.=她是律师。；O carro é híbrido.=这辆车是混动。'),wordItem('estar','在；处于；临时状态','estar 表示位置、临时状态、是否准备好。','生活出行','问路交通','道路方向','动词','现在时: eu estou=我在；você está=你在；ele/ela está=他/她在；a gente está=我们在；nós estamos=我们在；vocês estão=你们在；eles/elas estão=他们在 | 过去时: eu estive=我曾在；você esteve=你曾在；ele/ela esteve=他/她曾在 | 未来: vou estar=我会在；você vai estar=你会在','Estou na loja.=我在店里。；O pagamento está pendente.=付款待处理。')],sentences:[sentenceItem('Pode repetir, por favor?','可以重复一遍吗？','语言沟通','听不懂求助','让对方重复','A1','repetir'),sentenceItem('Pode falar mais devagar?','可以说慢一点吗？','语言沟通','听不懂求助','让对方慢点说','A1','devagar')],stories:[storyItem('História curta 1: Perguntar o endereço','Arthur precisava resolver uma coisa simples em São Paulo. Ele perguntou sobre o endereço e ouviu a resposta com atenção. No começo, não entendeu tudo, então pediu para repetir mais devagar. Depois, confirmou a informação e conseguiu resolver o problema.','Arthur在São Paulo需要解决一件简单的事情。他询问了地址，并认真听对方回答。一开始他没有全部听懂，所以请对方慢一点重复。之后，他确认了信息，成功解决了问题。','生活沟通','问路交通','地址确认','A1-A2',{cnTitle:'短故事1：问路和地址',cat4:'道路方向',length:'短故事',keywords:'endereço;rua',contentType:'STORY',learningPath:'COMM6M',nativeness:'5',source:'sample',status:'approved'})],novels:[novelSample()]};await putMany('words',sample.words);await putMany('sentences',sample.sentences);await putMany('stories',sample.stories);await putMany('novels',sample.novels);}
function baseItem(module){
    var contentType = moduleToContentType(module);

    return {
        id:module + '_' + Date.now() + '_' + Math.random().toString(36).slice(2),
        contentId:'',
        contentType:contentType,
        learningPath:'MASTER',
        level:'A1',
        cat1:'',
        cat2:'',
        cat3:'',
        nativeness:'',
        related:'',
        source:'',
        status:'approved',
        updatedAtText:'',
        module:module,

        favorite:false,
        hidden:false,
        wrong:0,
        uncertain:0,
        reviewCount:0,
        masterCount:0,
        maxInterval:0,
        createdAt:Date.now(),
        updatedAt:Date.now(),
        lastStudyAt:0,
        reviewAt:0
    };
}
function moduleToContentType(module){
    if(module === 'words'){
        return 'WORD';
    }

    if(module === 'phrases'){
        return 'PHRASE';
    }

    if(module === 'sentences'){
        return 'SENTENCE';
    }

    if(module === 'stories'){
        return 'STORY';
    }

    if(module === 'novels'){
        return 'NOVEL';
    }

    return '';
}
function wordItem(title,cn,explain,cat1,cat2,cat3,pos,formsRaw,examplesRaw,extra){
    extra = extra || {};

    var targetModule = extra.module || 'words';
    var targetType = extra.contentType || moduleToContentType(targetModule) || 'WORD';

    var x = baseItem(targetModule);

    Object.assign(x,{
        module:targetModule,
        contentType:targetType,
        title:String(title || '').trim(),
        pt:String(title || '').trim(),
        cn:String(cn || '').trim(),
        explain:String(explain || '').trim(),
        cat1:String(cat1 || '').trim(),
        cat2:String(cat2 || '').trim(),
        cat3:String(cat3 || '').trim(),
        pos:String(pos || '').trim(),
        formsRaw:String(formsRaw || '').trim(),
        examplesRaw:String(examplesRaw || '').trim(),
        formGroups:parseForms(formsRaw),
        examples:parsePairs(examplesRaw)
    });

    Object.assign(x,extra);

    if(!x.learningPath){
        x.learningPath = 'MASTER';
    }

    if(!x.level){
        x.level = 'A1';
    }

    return x;
}
function isPhraseTitle(title){
    title = String(title || '').trim();

    if(title.indexOf(' ') >= 0){
        return true;
    }

    if(title.indexOf('/') >= 0){
        return true;
    }

    if(title.indexOf('-se') >= 0){
        return true;
    }

    return false;
}

async function getNovelProgressSummary(){
    var novels = await getAll('novels');

    var reading = 0;
    var completed = 0;
    var notStarted = 0;

    for(var i=0;i<novels.length;i++){
        var n = novels[i];

        var raw = localStorage.getItem('chanlai_novel_progress_'+n.id);

        if(!raw){
            notStarted++;
            continue;
        }

        try{
            var p = JSON.parse(raw);
            var total = (n.chapters || []).length || 1;
            var current = (p.chapterIndex || 0) + 1;
            var percent = current / total;

            if(percent >= 1){
                completed++;
            }else{
                reading++;
            }
        }catch(e){
            notStarted++;
        }
    }

    return {
        reading:reading,
        completed:completed,
        notStarted:notStarted
    };
}
async function getNovelProgressList(){
    var novels = await getAll('novels');
    var list = [];

    for(var i=0;i<novels.length;i++){
        var n = novels[i];
        var raw = localStorage.getItem('chanlai_novel_progress_'+n.id);

        var total = (n.chapters || []).length || 1;
        var current = 0;

        if(raw){
            try{
                var p = JSON.parse(raw);
                current = (p.chapterIndex || 0) + 1;
            }catch(e){
                current = 0;
            }
        }

        var percent = Math.round(current / total * 100);

        list.push({
            id:n.id,
            title:n.title,
            current:current,
            total:total,
            percent:percent
        });
    }

    list.sort(function(a,b){
        return b.percent - a.percent;
    });

    return list;
}

    var reviewRate = total ? Math.round(reviewTotal / total * 100) : 0;
    var wrongRate = total ? Math.round(wrongTotal / total * 100) : 0;

    var score = 100;

    score -= Math.min(40,wrongRate * 2);
    score -= Math.min(30,reviewRate);

    if(masterRate < 20){
        score -= 20;
    }

    if(score < 0){
        score = 0;
    }

    var level = '健康';

    if(score < 80){
        level = '一般';
    }

    if(score < 60){
        level = '需要加强';
    }

    $(boxId).innerHTML =
    '<b>学习健康度</b><br>'+
    '健康分：'+score+' / 100｜'+level+'<br>'+
    '总内容：'+total+' 条<br>'+
    '已掌握：'+mastered+' 条｜掌握率：'+masterRate+'%<br>'+
    '复习中：'+reviewTotal+' 条｜复习占比：'+reviewRate+'%<br>'+
    '错误记录：'+wrongTotal+' 次｜错误占比：'+wrongRate+'%';
}

function getStudyStreak(){
    var raw = localStorage.getItem('chanlai_study_stats');
    var data = {};

    try{
        data = JSON.parse(raw || '{}');
    }catch(e){
        data = {};
    }

    var today = new Date();
    var current = 0;

    for(var i=0;i<365;i++){
        var d = new Date(today);
        d.setDate(today.getDate() - i);

        var key = dateKeyLocal(d);
        var learn = data[key] && data[key].learn ? data[key].learn : 0;

        if(learn > 0){
            current++;
        }else{
            break;
        }
    }

    var longest = 0;
    var temp = 0;
    var keys = Object.keys(data).sort();

    keys.forEach(function(key){
        var learn = data[key] && data[key].learn ? data[key].learn : 0;

        if(learn > 0){
            temp++;
            if(temp > longest){
                longest = temp;
            }
        }else{
            temp = 0;
        }
    });

    return {
        current:current,
        longest:longest
    };
}

function getStudySummary(){
    var raw = localStorage.getItem('chanlai_study_stats');
    var data = {};

    try{
        data = JSON.parse(raw || '{}');
    }catch(e){
        data = {};
    }

    var today = new Date();
    var todayKey = dateKeyLocal(new Date());

    var week = {
        learn:0,
        read:0,
        play:0,
        master:0,
        review:0,
        wrong:0
    };

    var month = {
        learn:0,
        read:0,
        play:0,
        master:0,
        review:0,
        wrong:0
    };

    var total = {
        learn:0,
        read:0,
        play:0,
        master:0,
        review:0,
        wrong:0
    };

    Object.keys(data).forEach(function(day){
        var t = data[day] || {};
        var d = new Date(day);
        var diffDays = Math.floor((today - d) / 86400000);

        ['learn','read','play','master','review','wrong'].forEach(function(k){
            var v = t[k] || 0;

            total[k] += v;

            if(diffDays >= 0 && diffDays < 7){
                week[k] += v;
            }

            if(day.slice(0,7) === todayKey.slice(0,7)){
                month[k] += v;
            }
        });
    });

    return {
        week:week,
        month:month,
        total:total
    };
}

async function loadModuleList(module){
    var q = $('q_'+module).value.trim().toLowerCase();
    var filter = $('filter_'+module).value;
    var cat1 = $('cat1_'+module).value.trim().toLowerCase();
    var cat2 = $('cat2_'+module).value.trim().toLowerCase();
    var cat3 = $('cat3_'+module).value.trim().toLowerCase();
    var level = $('level_'+module).value.trim().toLowerCase();

    var rows = await getAll(module);

    rows = rows.filter(matchLearningPath);

    rows = rows.filter(function(x){
        if(filter === 'favorite' && !x.favorite) return false;
        if(filter === 'hard' && !x.uncertain && !x.wrong) return false;
        if(filter === 'review' && !(x.reviewAt && x.reviewAt <= Date.now())) return false;

        if(cat1 && String(x.cat1 || '').toLowerCase() !== cat1) return false;
        if(cat2 && String(x.cat2 || '').toLowerCase() !== cat2) return false;
        if(cat3 && String(x.cat3 || '').toLowerCase() !== cat3) return false;
        if(level && String(x.level || '').toLowerCase() !== level) return false;

        if(q){
            var text = [
                x.title,
                x.pt,
                x.cn,
                x.cat1,
                x.cat2,
                x.cat3,
                x.level,
                x.learningPath,
                x.contentType,
                x.cnTitle
            ].join(' ').toLowerCase();

            if(text.indexOf(q) < 0){
                return false;
            }
        }

        return true;
    });

    rows.sort(compareContentOrder);

    var total = rows.length;
    var start = (state.page[module] - 1) * PAGE_SIZE;
    var pageRows = rows.slice(start,start + PAGE_SIZE);

    if(pageRows.length === 0 && state.page[module] > 1){
        state.page[module]--;
        return loadModuleList(module);
    }

    $('pageInfo_'+module).textContent =
        '第 ' + state.page[module] + ' 页，每页 ' + PAGE_SIZE + ' 条，共 ' + total + ' 条';

    $('list_'+module).innerHTML =
        pageRows.map(itemCard).join('') || '<div class="notice">没有内容。</div>';

    if(pageRows[0]){
        selectItem(module,pageRows[0].id);
    }else{
        $('detail_'+module).innerHTML =
            '<div class="notice">没有符合当前学习路线的内容。</div>';
    }
}
function getContentOrderNumber(x){
    var id = String(x.contentId || x.sourceId || x.id || '').trim();
    var m = id.match(/(\d+)$/);

    if(m){
        return Number(m[1]);
    }

    return 999999999;
}
function compareContentOrder(a,b){
    var na = getContentOrderNumber(a);
    var nb = getContentOrderNumber(b);

    if(na !== nb){
        return na - nb;
    }

    return String(a.title || a.pt || '').localeCompare(String(b.title || b.pt || ''));
}
async function scanStore(store){
    var rows = await getAll(store);

    var cat1Set = new Set();
    var cat2Set = new Set();
    var cat3Set = new Set();
    var levelSet = new Set();

    rows.forEach(function(item){

        if(!matchLearningPath(item)){
            return;
        }

        if(item.cat1){
            cat1Set.add(item.cat1);
        }

        if(item.cat2){
            cat2Set.add(item.cat2);
        }

        if(item.cat3){
            cat3Set.add(item.cat3);
        }

        if(item.level){
            levelSet.add(item.level);
        }
    });

    return {
        cat1:[...cat1Set].sort(),
        cat2:[...cat2Set].sort(),
        cat3:[...cat3Set].sort(),
        level:[...levelSet].sort()
    };
}

            '<div><b>不确定次数</b>'+(x.uncertain || 0)+'</div>'+
            '<div><b>复习次数</b>'+(x.reviewCount || 0)+'</div>'+
            '<div><b>掌握次数</b>'+(x.masterCount || 0)+'</div>'+
        '</div>'+
    '</div>';

    h += reviewBtns(x) + statsHtml(x);
    h += contentMetaHtml(x);
    h += contentRawFieldsHtml(x);

    if(!state.openChapterIndex && state.openChapterIndex !== 0){
        setTimeout(function(){
            if(chapters.length){
                renderChapter(x.id,progressIndex);
            }
        },50);
    }

    setTimeout(function(){
        var input = $('chapterSearch');

        if(!input){
            return;
        }

        input.oninput = function(){
            var kw =
            this.value
            .trim()
            .toLowerCase();

            document
            .querySelectorAll(
                '[data-action="chapter"]'
            )
            .forEach(function(el){
                var text =
                el.textContent
                .toLowerCase();

                el.style.display =
                !kw || text.indexOf(kw)>=0
                ? ''
                : 'none';
            });
        };

    },50);

    return h;
}

        list = [];
    }

    list = list.filter(function(x){

async function addSmartReview(module,id,result){
    var x = await getOne(module,id);

    if(!x){
        return;
    }

    var days = 1;
    var status = '复习';

    if(result === 'good'){
        days = nextReviewInterval(x.maxInterval || 0);
        status = '掌握';
        x.masterCount = (x.masterCount || 0) + 1;
        x.lastResult = 'good';
    }

    if(result === 'hard'){
        days = 1;
        status = '不确定';
        x.uncertain = (x.uncertain || 0) + 1;
        x.lastResult = 'hard';
    }

    if(result === 'wrong'){
        days = 0;
        status = '错误';
        x.wrong = (x.wrong || 0) + 1;
        x.lastWrongAt = Date.now();
        x.lastResult = 'wrong';
    }

    x.hidden = true;
    x.reviewCount = (x.reviewCount || 0) + 1;
    x.maxInterval = days;
    x.updatedAt = Date.now();

    await putOne(module,x);

    var r = {
        id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2),
        module:module,
        itemId:id,
        title:x.title,
        daysLeft:days,
        interval:days,
        status:status,
        createdAt:Date.now(),
        updatedAt:Date.now()
    };

    await putOne('review',r);

    alert('已加入复习：'+status+'，'+days+'天后复习');

    await renderModule(module);
}

    if(!r){

async function answerReview(id,result){
    var r = await getOne('review',id);

    if(!r){
        return;
    }

    if(result === 'good'){
        var next = nextReviewInterval(r.interval || 1);

        r.daysLeft = next;
        r.interval = next;
        r.status = '掌握';
    }

    if(result === 'hard'){

        var prev = previousReviewInterval(
            r.interval || 1
        );

        r.daysLeft = prev;
        r.interval = prev;
        r.status = '不确定';
    }

    if(result === 'wrong'){
        r.daysLeft = 0;
        r.interval = 0;
        r.status = '错误';
    }

    r.updatedAt = Date.now();

    await putOne('review',r);

    renderReview();
}
function nextReviewInterval(current){
    var steps = [1,3,7,15,30,60];

    for(var i=0;i<steps.length;i++){
        if(current < steps[i]){
            return steps[i];
        }
    }

    return 60;
}
function previousReviewInterval(current){

    var steps = [1,3,7,15,30,60];

    var index = steps.indexOf(current);

    if(index <= 0){
        return 1;
    }

    return steps[index - 1];
}

function bindQuickFullSwipe(){
    var box = $('quickFullScreen');

    if(!box || box.dataset.swipeBound === '1'){
        return;
    }

    box.dataset.swipeBound = '1';

    box.addEventListener('touchstart',function(e){
        if(!e.touches || !e.touches.length){
            return;
        }

        quickTouchStartX = e.touches[0].clientX;
        quickTouchStartY = e.touches[0].clientY;
    },{passive:true});

    box.addEventListener('touchend',async function(e){
        if(!e.changedTouches || !e.changedTouches.length){
            return;
        }

        var dx = e.changedTouches[0].clientX - quickTouchStartX;
        var dy = e.changedTouches[0].clientY - quickTouchStartY;
        var absX = Math.abs(dx);
        var absY = Math.abs(dy);

        if(absX < 70 && absY < 70){
            return;
        }

        if(absX > absY){
            if(dx < 0){
                await quickFullMarkAndNext('wrong');
            }else{
                await quickFullMarkAndNext('good');
            }
            return;
        }

        if(dy < 0){
            await quickFullNextItem();
        }else{
            quickPrevItem();
        }
    },{passive:true});
}

async function addSmartReviewSilent(module,id,result){
    var x = await getOne(module,id);

    if(!x){
        return;
    }

    var days = 1;
    var status = '复习';

    if(result === 'good'){
        days = nextReviewInterval(x.maxInterval || 0);
        status = '掌握';
        x.masterCount = (x.masterCount || 0) + 1;
    }

    if(result === 'hard'){
        days = 1;
        status = '不确定';
        x.uncertain = (x.uncertain || 0) + 1;
    }

    if(result === 'wrong'){
        days = 0;
        status = '错误';
        x.wrong = (x.wrong || 0) + 1;
        x.lastWrongAt = Date.now();
    }

    x.hidden = true;
    x.reviewCount = (x.reviewCount || 0) + 1;
    x.maxInterval = days;
    x.updatedAt = Date.now();

    await putOne(module,x);

    var r = {
        id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2),
        module:module,
        itemId:id,
        title:x.title,
        daysLeft:days,
        interval:days,
        status:status,
        createdAt:Date.now(),
        updatedAt:Date.now()
    };

    await putOne('review',r);

    trackStudy('review');

    if(result === 'good'){
        trackStudy('master');
    }

    if(result === 'wrong'){
        trackStudy('wrong');
    }

    return {
        status:status,
        days:days
    };
}

async function buildPlayQueue(){
    var m = $('playModule').value;
    var store = m;
    var cat1 = $('playCat1') ? $('playCat1').value.trim().toLowerCase() : '';
    var cat2 = $('playCat2') ? $('playCat2').value.trim().toLowerCase() : '';
    var cat3 = $('playCat3') ? $('playCat3').value.trim().toLowerCase() : '';
    var level = $('playLevel').value.trim().toLowerCase();
    var filter = $('playFilter').value;

    var rows = await getAll(store);

    rows = rows.filter(matchLearningPath);

    rows = rows.filter(function(x){
        if(filter === 'favorite' && !x.favorite) return false;
        if(filter === 'hard' && !x.uncertain && !x.wrong) return false;
        if(filter === 'review' && !(x.reviewAt && x.reviewAt <= Date.now())) return false;

        if(cat1 && String(x.cat1 || '').toLowerCase() !== cat1) return false;
        if(cat2 && String(x.cat2 || '').toLowerCase() !== cat2) return false;
        if(cat3 && String(x.cat3 || '').toLowerCase() !== cat3) return false;
        if(level && String(x.level || '').toLowerCase() !== level) return false;

        return true;
    });

    if(m === 'stories'){
        if(filter === 'short'){
            rows = rows.filter(function(x){
                return String(x.length || x.storyLength || x.cat1 || '').indexOf('短') >= 0;
            });
        }

        if(filter === 'mid'){
            rows = rows.filter(function(x){
                return String(x.length || x.storyLength || x.cat1 || '').indexOf('中') >= 0;
            });
        }

        if(filter === 'long'){
            rows = rows.filter(function(x){
                return String(x.length || x.storyLength || x.cat1 || '').indexOf('长') >= 0;
            });
        }
    }

    rows.sort(function(a,b){
        return (b.updatedAt || 0) - (a.updatedAt || 0);
    });

    rows = rows.slice(0,loadSettings().playLimit || 5000);

    state.playQueue = [];

    rows.forEach(function(x){
        addToQueue(x);
    });

    var startIndex = Number($('playStartIndex').value || 1) - 1;

    if(startIndex < 0){
        startIndex = 0;
    }

    if(startIndex >= state.playQueue.length){
        startIndex = 0;
    }

    state.playIndex = startIndex;

    $('playSummary').textContent =
    '已生成 '+state.playQueue.length+' 条，最多显示前300条。';

    renderPlayListWindow();
}
function renderPlayListWindow(){

function queueTextByType(x){
    var type = String(x.contentType || moduleToContentType(x.module) || '').toUpperCase();

    if(type === 'WORD'){
        return x.title || x.pt || '';
    }

    if(type === 'SENTENCE' || type === 'DIALOGUE'){
        return x.pt || x.title || '';
    }

    if(type === 'STORY'){
        return x.pt || '';
    }

    if(type === 'NOVEL'){
        return x.pt || '';
    }

    return x.pt || x.title || '';
}
function addToQueue(x){
    var unit = $('playUnit') ? $('playUnit').value : 'sentence';
    var type = String(x.contentType || moduleToContentType(x.module) || '').toUpperCase();

    if(x.module === 'words'){
        if(unit === 'word'){
            state.playQueue.push({
                title:x.title,
                pt:queueTextByType(x),
                cn:''
            });
        }

        if(unit === 'word_cn'){
            state.playQueue.push({
                title:x.title,
                pt:queueTextByType(x),
                cn:x.cn
            });
        }

        if(unit === 'forms'){
            state.playQueue.push({
                title:x.title,
                pt:queueTextByType(x),
                cn:x.cn
            });

            (x.formGroups || parseForms(x.formsRaw || '') || []).forEach(function(g){
                (g.items || []).forEach(function(it){
                    state.playQueue.push({
                        title:x.title+'｜'+g.label,
                        pt:it.pt,
                        cn:it.cn
                    });
                });
            });
        }

        if(unit === 'examples'){
            getExamples(x).forEach(function(it){
                state.playQueue.push({
                    title:x.title+'｜例句',
                    pt:it.pt,
                    cn:it.cn
                });
            });
        }
    }

    else if(x.module === 'phrases'){
        state.playQueue.push({
            title:x.title,
            pt:x.title || x.pt || '',
            cn:unit === 'phrase_cn' ? x.cn : ''
        });
    }

    else if(x.module === 'sentences'){
        state.playQueue.push({
            title:x.title || queueTextByType(x),
            pt:queueTextByType(x),
            cn:x.cn,
            contentType:type
        });
    }

    else if(x.module === 'stories'){
        addTextQueue(x.title,queueTextByType(x),x.cn);
    }

    else if(x.module === 'novels'){
        if(unit === 'chapter'){
            (x.chapters || []).forEach(function(c){
                state.playQueue.push({
                    title:x.title+'｜'+c.titlePt,
                    pt:c.pt,
                    cn:c.cn
                });
            });
        }else{
            (x.chapters || []).forEach(function(c){
                addTextQueue(x.title+'｜'+c.titlePt,c.pt,c.cn);
            });
        }
    }
}
function addTextQueue(title,pt,cn){
    var unit = $('playUnit') ? $('playUnit').value : 'sentence';

    if(unit === 'paragraph'){
        var ps = splitParagraphs(pt);
        var cs = splitParagraphs(cn);

        ps.forEach(function(p,i){
            state.playQueue.push({
                title:title,
                pt:p,
                cn:cs[i] || ''
            });
        });

        return;
    }

    if(unit === 'full' || unit === 'chapter' || unit === 'book'){
        state.playQueue.push({
            title:title,
            pt:pt,
            cn:cn
        });

        return;
    }

    var ps = splitSentences(pt);
    var cs = splitSentences(cn);

    ps.forEach(function(p,i){
        state.playQueue.push({
            title:title,
            pt:p,
            cn:cs[i] || ''
        });
    });
}
function splitParagraphs(text){
    return String(text || '')
        .split(/\n\s*\n/)
        .map(function(x){
            return x.trim();
        })
        .filter(Boolean);
}

function splitBlocks(text){
    var clean = String(text || '').replace(/\r/g,'\n').trim();

    if(!clean){
        return [];
    }

    return clean
        .split(/\n?\s*(?:⸻|—{2,}|–{2,}|-{3,})\s*\n/g)
        .map(function(x){
            return x.trim();
        })
        .filter(function(x){

        });

function val(b,label){
    var re = new RegExp(
        '【' + reEscape(label) + '】\\s*([\\s\\S]*?)(?=\\n【|\\n\\s*(?:⸻|—{2,}|–{2,}|-{3,})\\s*\\n|\\n\\d{5}\\.|$)'
    );

    var m = String(b || '').match(re);

    return m ? m[1].trim() : '';
}
function valKey(b,key){
    var text = String(b || '').replace(/\r/g,'\n');
    var keys = importFieldKeys().map(function(k){
        return String(k || '').toLowerCase();
    });

    var lines = text.split('\n');
    var out = [];
    var reading = false;

    for(var i = 0; i < lines.length; i++){
        var line = lines[i];
        var m = line.match(/^([A-Za-z_][A-Za-z0-9_]*|[\u4e00-\u9fa5A-Za-z0-9_\/]+)\s*:\s*(.*)$/);

        if(m){
            var foundKey = String(m[1] || '').trim();
            var foundValue = m[2] || '';

            if(reading){
                if(keys.indexOf(foundKey.toLowerCase()) >= 0){
                    break;
                }else{
                    out.push(line);
                    continue;
                }
            }

            if(foundKey.toLowerCase() === String(key).toLowerCase()){
                reading = true;
                out.push(foundValue);
                continue;
            }
        }else if(reading){
            out.push(line);
        }
    }

    return out.join('\n').trim();
}
function valAny(b,labels){
    for(var i = 0; i < labels.length; i++){
        var oldValue = val(b,labels[i]);

        if(oldValue){
            return oldValue;
        }

        var keyValue = valKey(b,labels[i]);

        if(keyValue){
            return keyValue;
        }
    }

    return '';
}

            if(pt || cn){

    });

    return out;

function getImportKey(item,rule){
    item = item || {};
    rule = rule || 'title';

    var module = item.module || '';

    if(rule === 'id'){
        var idValue = item.contentId || item.sourceId || '';

        if(!idValue && item.id && String(item.id).indexOf(module + '_') !== 0){
            idValue = item.id;
        }

        if(idValue){
            return 'id::' + normalizeImportText(idValue);
        }
    }

    if(rule === 'pt'){
        return 'pt::' + normalizeImportText(item.pt || item.title || '');
    }

    if(rule === 'title'){
        if(module === 'words' || item.contentType === 'WORD'){
            return 'title::' + normalizeImportText(item.title || item.pt || '');
        }

        if(module === 'sentences' || item.contentType === 'SENTENCE' || item.contentType === 'DIALOGUE'){
            return 'pt::' + normalizeImportText(item.pt || item.title || '');
        }

        if(module === 'stories' || module === 'novels'){
            return 'title::' + normalizeImportText(item.title || item.pt || item.contentId || '');
        }

        return 'title::' + normalizeImportText(item.title || item.pt || item.contentId || '');
    }

    return rule + '::' + normalizeImportText(item[rule] || item.title || item.pt || item.contentId || '');

        'favorite',

        'wrong',
        'uncertain',
        'reviewCount',
        'masterCount',
        'maxInterval',
        'createdAt',
        'lastStudyAt',
        'reviewAt'

async function confirmImport(){
    if(!state.importPreview.length){
        alert('请先预览');
        return;
    }

    await createAutoSnapshot('导入前');

    var dupRule = $('importDupKey') ? $('importDupKey').value : 'title';
    var dupAction = $('importDupAction') ? $('importDupAction').value : 'replace';

    var groups = {
        words:[],
        phrases:[],
        sentences:[],
        stories:[],
        novels:[]
    };

    var stat = {
        add:0,
        skip:0,
        replace:0
    };

    for(var m of ['words','phrases','sentences','stories','novels']){
        var oldRows = await getAll(m);
        var oldMap = {};

        oldRows.forEach(function(oldItem){
            oldMap[getImportKey(oldItem,dupRule)] = oldItem;
        });

        state.importPreview.forEach(function(x){
            if(x.module !== m){
                return;
            }

            var key = getImportKey(x,dupRule);
            var oldItem = oldMap[key];

            if(oldItem && dupAction === 'skip'){
                stat.skip++;
                return;
            }

            if(oldItem){
                x = preserveStudyState(x,oldItem);
                groups[m].push(x);
                stat.replace++;
                return;
            }

            groups[m].push(x);
            stat.add++;
        });
    }

    for(var m of ['words','phrases','sentences','stories','novels']){
        if(groups[m].length){
            await putMany(m,groups[m],function(done,total){
                $('importProgress').innerHTML =
                    '<div class="notice">正在保存 '+moduleName(m)+'：'+done+'/'+total+'</div>';
            });
        }
    }

    state.importPreview = [];

    $('importProgress').innerHTML =
        '<div class="notice">导入完成：新增 '+stat.add+
        ' 条，跳过 '+stat.skip+
        ' 条，更新 '+stat.replace+
        ' 条。学习状态已保留。</div>';

    addSystemLog(
        '导入',
        '新增 '+stat.add+' 条，跳过 '+stat.skip+' 条，更新 '+stat.replace+' 条，学习状态已保留'
    );

    if($('snapshotList')){
        renderSnapshotList();
    }

    renderHome();
}

async function restoreBackupFromFile(e){
    var file = e.target.files && e.target.files[0];

    if(!file){
        return;
    }

    if(!confirm('确认恢复这个备份吗？当前本地数据会被备份内容覆盖。')){
        e.target.value = '';
        return;
    }

    var text = await file.text();
    var backup = null;

    try{
        backup = JSON.parse(text);
    }catch(err){
        alert('备份文件格式错误，无法读取。');
        e.target.value = '';
        return;
    }

    if(!backup || !backup.stores){
        alert('这不是有效的 Chanlai 备份文件。');
        e.target.value = '';
        return;
    }

    await createAutoSnapshot('恢复备份前');

    for(var i=0;i<stores.length;i++){
        var store = stores[i];
        var rows = backup.stores[store] || [];

        await clearStore(store);

        if(rows.length){
            await putMany(store,rows);
        }
    }

    if(backup.local){
        if(backup.local.settings !== undefined){
            localStorage.setItem(SETTINGS_KEY,backup.local.settings);
        }

        if(backup.local.draftSettings !== undefined){
            localStorage.setItem(DRAFT_KEY,backup.local.draftSettings);
        }

        if(backup.local.studyStats !== undefined){
            localStorage.setItem('chanlai_study_stats',backup.local.studyStats);
        }

        if(backup.local.systemLogs !== undefined){
            localStorage.setItem('chanlai_system_logs',backup.local.systemLogs);
        }

        if(backup.local.novelHistory !== undefined){
            localStorage.setItem('chanlai_novel_history',backup.local.novelHistory);
        }

        if(backup.local.novelBookmarks !== undefined){
            localStorage.setItem('chanlai_novel_bookmarks',backup.local.novelBookmarks);
        }

        if(backup.local.novelReadLogs !== undefined){
            localStorage.setItem('chanlai_novel_read_logs',backup.local.novelReadLogs);
        }

        if(backup.local.sampleSeedDisabled !== undefined){
            localStorage.setItem(SAMPLE_SEED_DISABLED_KEY,backup.local.sampleSeedDisabled);
        }

        if(backup.local.novelProgress){
            Object.keys(backup.local.novelProgress).forEach(function(key){
                localStorage.setItem(key,backup.local.novelProgress[key]);
            });
        }
    }

    addSystemLog('恢复完整备份',backup.version || 'unknown');

    alert('备份恢复完成。页面将刷新。');

    location.reload();

async function renderTrashBox(){
    if(!$('trashBox')){
        return;
    }

    var list = await getAll('trash');

    list.sort(function(a,b){
        return (b.deletedAt || 0) - (a.deletedAt || 0);
    });

    if(!list.length){
        $('trashBox').innerHTML =
        '<div class="notice">回收站为空。</div>';
        return;
    }

    var html = '';

    list.slice(0,100).forEach(function(x){
        var time = x.deletedAt
            ? new Date(x.deletedAt).toLocaleString()
            : '未知时间';

        html +=
        '<div class="item" style="cursor:default">'+
            '<b>'+esc(x.title || x.cnTitle || x.cn || '无标题')+'</b>'+
            '<span>原模块：'+esc(moduleName(x.originalModule || ''))+'</span>'+
            '<span>删除时间：'+esc(time)+'</span>'+
            '<div class="row" style="margin-top:8px">'+
                '<button class="btn small green" onclick="restoreTrashItem(\''+escAttr(x.id)+'\')">恢复</button>'+
                '<button class="btn small red" onclick="deleteTrashItemForever(\''+escAttr(x.id)+'\')">彻底删除</button>'+
            '</div>'+
        '</div>';
    });

    $('trashBox').innerHTML = html;
}
async function restoreTrashItem(id){
    var x = await getOne('trash',id);

    if(!x){
        alert('没有找到回收站内容');
        return;
    }

    var module = x.originalModule;
    var originalId = x.originalId;

    if(!module || !originalId){
        alert('缺少原始模块或原始ID，无法恢复');
        return;
    }

    var restoreItem = Object.assign({},x);

    restoreItem.id = originalId;
    restoreItem.module = module;
    restoreItem.updatedAt = Date.now();

    delete restoreItem.originalId;
    delete restoreItem.originalModule;
    delete restoreItem.deletedAt;

    await putOne(module,restoreItem);
    await delOne('trash',id);

    addSystemLog('恢复回收站',module + ' / ' + (restoreItem.title || restoreItem.cn || originalId));

    await renderTrashBox();

    alert('已恢复');
}
async function deleteTrashItemForever(id){
    if(!confirm('确认彻底删除？这个操作不能恢复。')){

        '将永久删除：\n'+
        '• 单词、短语、句子、故事、小说\n'+

    );

    if(!firstConfirm){

    }

    var verify=prompt('为防止误操作，请输入：彻底清空测试数据');

    if(verify!=='彻底清空测试数据'){
        alert('输入内容不正确，已经取消清空。');
        return;
    }

    try{
        if(window.speechSynthesis){
            window.speechSynthesis.cancel();
        }

        if(quickAutoTimer){
            clearTimeout(quickAutoTimer);
            quickAutoTimer=null;
        }

        /* 清空 IndexedDB 中全部业务、统计和快照仓库。 */
        for(var i=0;i<stores.length;i++){
            if(db.objectStoreNames.contains(stores[i])){
                await clearStore(stores[i]);
            }
        }

        /* 保留同步连接和正式系统设置，其余 Chanlai 本地记录全部删除。 */
        var protectedLocalKeys={};
        protectedLocalKeys[SETTINGS_KEY]=true;
        protectedLocalKeys[GITHUB_SYNC_CONFIG_KEY]=true;
        protectedLocalKeys[GITHUB_SYNC_TOKEN_KEY]=true;

        var localKeys=[];
        for(var j=0;j<localStorage.length;j++){
            var localKey=localStorage.key(j);
            if(String(localKey||'').indexOf('chanlai_')===0&&!protectedLocalKeys[localKey]){
                localKeys.push(localKey);
            }
        }

        localKeys.forEach(function(key){
            localStorage.removeItem(key);
        });

        var protectedSessionKeys={};
        protectedSessionKeys[GITHUB_SYNC_SESSION_TOKEN_KEY]=true;

        var sessionKeys=[];
        for(var k=0;k<sessionStorage.length;k++){
            var sessionKey=sessionStorage.key(k);
            if(String(sessionKey||'').indexOf('chanlai_')===0&&!protectedSessionKeys[sessionKey]){
                sessionKeys.push(sessionKey);
            }
        }

        sessionKeys.forEach(function(key){
            sessionStorage.removeItem(key);
        });

        /* 永久关闭启动时自动写入内置测试资料。该标记会随 GitHub 同步到手机。 */
        localStorage.setItem(SAMPLE_SEED_DISABLED_KEY,'1');

        state.current=null;
        state.importPreview=[];
        state.playQueue=[];
        state.playIndex=0;
        state.isPlaying=false;
        quickCurrent=null;
        quickSequenceIndex=0;

        alert(
            '测试数据已经彻底清空。\n\n'+
            'GitHub 设置和当前系统设置已保留。\n'+
            '网页重新加载后不会再自动生成测试资料。\n\n'+
            '下一步：导入正式资料，检查数量，然后上传到 GitHub 覆盖旧的云端测试数据。'
        );

        location.reload();
    }catch(error){
        alert('彻底清空失败：'+(error&&error.message?error.message:String(error)));
    }

async function runHealthCheck(){
    var modules = ['words','phrases','sentences','stories','novels'];
    var total = 0;
    var html = '';

    html += '<div class="table-wrap">';
    html += '<table>';
    html += '<thead><tr>'+
        '<th>模块</th>'+
        '<th>总数</th>'+
        '<th>空标题</th>'+
        '<th>空一级</th>'+
        '<th>空二级</th>'+
        '<th>空三级</th>'+

        '<th>重复标题</th>'+
        '<th>重复葡语</th>'+
        '<th>重复中文</th>'+
        '<th>操作</th>'+
    '</tr></thead>';
    html += '<tbody>';

    for(var i=0;i<modules.length;i++){
        var m = modules[i];
        var rows = await getAll(m);

        total += rows.length;

        var emptyTitle = 0;
        var emptyCat1 = 0;
        var emptyCat2 = 0;
        var emptyCat3 = 0;
        var emptyLevel = 0;

        var titleMap = {};
        var duplicateTitle = 0;

        var ptMap = {};
        var duplicatePt = 0;

        var cnMap = {};
        var duplicateCn = 0;

        rows.forEach(function(x){
            var title = String(x.title || x.pt || '').trim().toLowerCase();
            var pt = String(x.pt || '').trim().toLowerCase();
            var cn = String(x.cn || x.cnTitle || '').trim().toLowerCase();

            if(!title){
                emptyTitle++;
            }

            if(!String(x.cat1 || '').trim()){
                emptyCat1++;
            }

            if(!String(x.cat2 || '').trim()){
                emptyCat2++;
            }

            if(!String(x.cat3 || '').trim()){
                emptyCat3++;
            }

            if(!String(x.level || x.difficulty || '').trim()){
                emptyLevel++;
            }

            if(title){
                if(titleMap[title]){
                    duplicateTitle++;
                }else{
                    titleMap[title] = true;
                }
            }

            if(pt){
                if(ptMap[pt]){
                    duplicatePt++;
                }else{
                    ptMap[pt] = true;
                }
            }

            if(cn){
                if(cnMap[cn]){
                    duplicateCn++;
                }else{
                    cnMap[cn] = true;
                }
            }
        });

        html += '<tr>'+
            '<td>'+moduleName(m)+'</td>'+
            '<td>'+rows.length+'</td>'+
            '<td>'+emptyTitle+'</td>'+
            '<td>'+emptyCat1+'</td>'+
            '<td>'+emptyCat2+'</td>'+
            '<td>'+emptyCat3+'</td>'+
            '<td>'+emptyLevel+'</td>'+
            '<td>'+duplicateTitle+'</td>'+
            '<td>'+duplicatePt+'</td>'+
            '<td>'+duplicateCn+'</td>'+
            '<td>'+
            '<button class="btn small gray" onclick="showDuplicateTitles(\''+m+'\')">标题</button>'+
            '<button class="btn small gray" onclick="showDuplicatePt(\''+m+'\')">葡语</button>'+
            '<button class="btn small gray" onclick="showDuplicateCn(\''+m+'\')">中文</button>'+
            '</td>'+
        '</tr>';
    }

    html += '</tbody></table></div>';

    html =
    '<div class="notice">数据库体检完成，总记录：'+total+' 条。</div>'+
    html;

    $('healthResult').innerHTML = html;
}
async function showDuplicateTitles(module){
    var rows = await getAll(module);
    var map = {};
    var duplicates = [];

    rows.forEach(function(x){
        var title = String(x.title || x.pt || '').trim();

        if(!title) return;

        var key = title.toLowerCase();

        if(!map[key]){
            map[key] = [];
        }

        map[key].push(x);
    });

    Object.keys(map).forEach(function(key){

            duplicates.push({

var GITHUB_SYNC_CONFIG_KEY='chanlai_github_sync_v1_config';

var GITHUB_SYNC_SCHEMA_VERSION=1;
var GITHUB_SYNC_MAX_BYTES=70*1024*1024;
var GITHUB_SYNC_STORES=['words','phrases','sentences','stories','novels','review','stats','trash'];
function githubDefaultDeviceName(){

function githubDefaultConfig(){

    };

function loadGitHubToken(){

function saveGitHubConfig(config,token){

    config.fileName=normalizeGitHubFileName(config.fileName);
    localStorage.setItem(GITHUB_SYNC_CONFIG_KEY,JSON.stringify(config));

    token=String(token||'').trim();
    if(config.rememberToken){

        if(token)localStorage.setItem(GITHUB_SYNC_TOKEN_KEY,token);
        else localStorage.removeItem(GITHUB_SYNC_TOKEN_KEY);
    }else{
        localStorage.removeItem(GITHUB_SYNC_TOKEN_KEY);
        if(token)sessionStorage.setItem(GITHUB_SYNC_SESSION_TOKEN_KEY,token);
        else sessionStorage.removeItem(GITHUB_SYNC_SESSION_TOKEN_KEY);
    }
}
function normalizeGitHubFileName(value){
    var name=String(value||'').trim().replace(/^\/+|\/+$/g,'').replace(/\/{2,}/g,'/');
    if(!name)name='chanlai-sync.json';
    if(!/\.json$/i.test(name))name+='.json';
    return name;
}
function githubEncodePath(path){
    return String(path||'').split('/').filter(Boolean).map(function(part){
        return encodeURIComponent(part);
    }).join('/');
}
function githubApiBase(config){
    return'https://api.github.com/repos/'
        +encodeURIComponent(config.owner)
        +'/'
        +encodeURIComponent(config.repo);
}
function githubErrorMessage(status,data,statusText){
    var message=data&&data.message?data.message:statusText||'未知错误';
    if(status===401)return'GitHub Token 无效或已过期。';
    if(status===403)return'GitHub 拒绝访问。请检查 Token 权限、仓库权限或 API 限制。';
    if(status===404)return'没有找到仓库、分支或同步文件。请检查 owner、repo、branch 和文件名。';
    if(status===409)return'GitHub 仓库状态冲突。空仓库请先在 GitHub 创建 README。';
    if(status===422)return'GitHub 无法写入：'+message+'。请检查分支和文件路径。';
    return'GitHub 请求失败 '+status+'：'+message;
}
async function githubApi(config,token,path,options){
    options=options||{};
    var headers=Object.assign({
        'Accept':'application/vnd.github+json',
        'Authorization':'Bearer '+token,
        'X-GitHub-Api-Version':'2022-11-28'
    },options.headers||{});

    var response;
    try{
        response=await fetch(githubApiBase(config)+path,{
            method:options.method||'GET',
            headers:headers,
            body:options.body===undefined?undefined:JSON.stringify(options.body),
            cache:options.cache||'no-store'
        });
    }catch(networkError){
        throw new Error(
            '浏览器无法连接 GitHub API。请检查网络、浏览器扩展或公司网络拦截，然后重试。原始错误：'
            +(networkError&&networkError.message?networkError.message:String(networkError))
        );
    }

    var text=await response.text();
    var data=null;
    if(text){
        try{data=JSON.parse(text);}catch(e){data={message:text};}
    }

    if(!response.ok){
        if(options.allow404&&response.status===404)return null;
        var error=new Error(githubErrorMessage(response.status,data,response.statusText));
        error.status=response.status;
        error.data=data;
        throw error;
    }
    return data;
}
async function githubDownloadText(config,token){
    var path='/contents/'+githubEncodePath(config.fileName)
        +'?ref='+encodeURIComponent(config.branch);
    var response;
    try{
        response=await fetch(githubApiBase(config)+path,{
            method:'GET',
            headers:{
                'Accept':'application/vnd.github.raw+json',
                'Authorization':'Bearer '+token,
                'X-GitHub-Api-Version':'2022-11-28'
            },
            cache:'no-store'
        });
    }catch(networkError){
        throw new Error(
            '浏览器无法下载 GitHub 同步文件。请检查网络、浏览器扩展或公司网络拦截，然后重试。原始错误：'
            +(networkError&&networkError.message?networkError.message:String(networkError))
        );
    }

    if(!response.ok){
        var raw=await response.text();
        var data=null;
        try{data=JSON.parse(raw);}catch(e){data={message:raw};}
        throw new Error(githubErrorMessage(response.status,data,response.statusText));
    }
    return response.text();
}
function githubTextBytes(text){
    if(window.TextEncoder)return new TextEncoder().encode(text);
    var encoded=unescape(encodeURIComponent(text));
    var bytes=new Uint8Array(encoded.length);
    for(var i=0;i<encoded.length;i++)bytes[i]=encoded.charCodeAt(i);
    return bytes;
}
function githubBytesToBase64(bytes){
    var binary='';
    var chunkSize=0x8000;
    for(var i=0;i<bytes.length;i+=chunkSize){
        var chunk=bytes.subarray(i,Math.min(i+chunkSize,bytes.length));
        binary+=String.fromCharCode.apply(null,chunk);
    }
    return btoa(binary);
}
function githubFormatBytes(bytes){
    bytes=Number(bytes||0);
    if(bytes<1024)return bytes+' B';
    if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';
    return(bytes/1024/1024).toFixed(2)+' MB';
}
function githubSyncableLocalKey(key){
    key=String(key||'');
    if(key.indexOf('chanlai_')!==0)return false;
    if(key===GITHUB_SYNC_CONFIG_KEY)return false;
    if(key===GITHUB_SYNC_TOKEN_KEY)return false;
    if(key===DRAFT_KEY)return false;
    return true;
}
function collectGitHubLocalStorage(){
    var result={};
    for(var i=0;i<localStorage.length;i++){
        var key=localStorage.key(i);
        if(githubSyncableLocalKey(key))result[key]=localStorage.getItem(key);
    }
    return result;
}
function clearGitHubSyncableLocalStorage(){
    var keys=[];
    for(var i=0;i<localStorage.length;i++){
        var key=localStorage.key(i);
        if(githubSyncableLocalKey(key))keys.push(key);
    }
    keys.forEach(function(key){localStorage.removeItem(key);});
}

function validateGitHubPackage(pack){
    if(!pack||typeof pack!=='object')throw new Error('云端同步文件不是有效 JSON 对象。');
    if(pack.app!=='Chanlai 葡语学习系统')throw new Error('云端文件不是 Chanlai 葡语学习系统同步文件。');
    if(Number(pack.schemaVersion)!==GITHUB_SYNC_SCHEMA_VERSION){
        throw new Error('同步文件结构版本不兼容：'+pack.schemaVersion);
    }
    if(!pack.stores||typeof pack.stores!=='object')throw new Error('同步文件缺少 stores 数据。');

    for(var i=0;i<GITHUB_SYNC_STORES.length;i++){
        var store=GITHUB_SYNC_STORES[i];
        if(!Array.isArray(pack.stores[store])){
            throw new Error('同步文件缺少 '+store+' 数组。');
        }
    }
    if(!pack.localStorage||typeof pack.localStorage!=='object')pack.localStorage={};
    return pack;
}

        config,

async function uploadGitHubSync(){
    setGitHubBusy(true);
    try{
        var config=loadGitHubConfig();
        var token=loadGitHubToken();
        validateGitHubConfig(config,token);

        setGitHubSyncStatus('正在检查 GitHub 仓库和分支……',false);
        await testGitHubConnection(config,token);

        setGitHubSyncStatus('正在读取本地数据库并生成同步包……',false);
        var pack=await buildGitHubSyncPackage();
        var jsonText=JSON.stringify(pack);
        var bytes=githubTextBytes(jsonText);

        if(bytes.length>GITHUB_SYNC_MAX_BYTES){
            throw new Error(
                '同步文件为 '+githubFormatBytes(bytes.length)
                +'，超过 V1 安全上限 70 MB。后续需要做 V2 分模块同步。'
            );
        }

        if(!confirm(
            '确认上传本地数据到 GitHub？\n\n'
            +githubCountsText(pack.counts)
            +'\n文件：'+config.fileName
            +'\n大小：'+githubFormatBytes(bytes.length)
            +'\n\n同名云端文件会更新，GitHub 提交历史仍会保留旧版本。'
        )){
            return;
        }

        setGitHubSyncStatus(
            '正在编码并上传 '+githubFormatBytes(bytes.length)+'……',
            false
        );

        var fileMetaPath='/contents/'+githubEncodePath(config.fileName)
            +'?ref='+encodeURIComponent(config.branch)
            +'&_='+Date.now();

        var current=await githubApi(
            config,
            token,
            fileMetaPath,
            {
                allow404:true,
                cache:'no-store'
            }
        );

        var body={
            message:'Chanlai V15 Beta sync '+pack.exportedAt+' from '+pack.deviceName,
            content:githubBytesToBase64(bytes),
            branch:config.branch
        };
        if(current&&current.sha)body.sha=current.sha;

        var result;
        try{
            result=await githubApi(
                config,
                token,
                '/contents/'+githubEncodePath(config.fileName),
                {method:'PUT',body:body,cache:'no-store'}
            );
        }catch(writeError){
            var writeMessage=writeError&&writeError.data&&writeError.data.message
                ?String(writeError.data.message)
                :String(writeError.message||'');

            if(writeError.status===422&&/sha.*wasn.t supplied/i.test(writeMessage)){
                setGitHubSyncStatus('检测到云端文件已存在，正在重新读取最新版并重试……',false);

                fileMetaPath='/contents/'+githubEncodePath(config.fileName)
                    +'?ref='+encodeURIComponent(config.branch)
                    +'&_='+Date.now();

                current=await githubApi(
                    config,
                    token,
                    fileMetaPath,
                    {
                        allow404:false,
                        cache:'no-store'
                    }
                );

                if(!current||!current.sha){
                    throw new Error('GitHub 已有同名文件，但无法取得文件 sha。请刷新页面后重试。');
                }

                body.sha=current.sha;
                result=await githubApi(
                    config,
                    token,
                    '/contents/'+githubEncodePath(config.fileName),
                    {method:'PUT',body:body,cache:'no-store'}
                );
            }else{
                throw writeError;
            }
        }

        config.lastUploadAt=new Date().toISOString();
        config.lastCloudExportedAt=pack.exportedAt;
        config.lastCloudSha=result&&result.content?result.content.sha:'';
        saveGitHubConfig(config,token);

        setGitHubSyncStatus(
            '<b>上传完成</b><br>'
            +'云端时间：'+esc(pack.exportedAt)
            +'<br>'+esc(githubCountsText(pack.counts))
            +'<br>文件：'+esc(config.fileName)
            +'｜'+githubFormatBytes(bytes.length),
            false
        );
        addSystemLog('GitHub上传',githubCountsText(pack.counts)+' / '+githubFormatBytes(bytes.length));
        renderSyncConfigSummary();
    }catch(error){
        setGitHubSyncStatus(esc(error.message||String(error)),true);
        addSystemLog('GitHub上传','失败 '+(error.message||String(error)));
    }finally{
        setGitHubBusy(false);
    }
}

async function restoreGitHubPackage(pack){
    validateGitHubPackage(pack);

    setGitHubSyncStatus('正在创建“GitHub恢复前”本地快照……',false);
    await createAutoSnapshot('GitHub恢复前');

    for(var i=0;i<GITHUB_SYNC_STORES.length;i++){
        var store=GITHUB_SYNC_STORES[i];
        var rows=pack.stores[store];
        setGitHubSyncStatus(
            '正在恢复 '+moduleName(store)+'：'+rows.length+' 条……',
            false
        );
        await clearStore(store);
        if(rows.length){
            await putMany(store,rows,function(done,total){
                setGitHubSyncStatus(
                    '正在恢复 '+moduleName(store)+'：'+done+' / '+total,
                    false
                );
            });
        }
    }

    clearGitHubSyncableLocalStorage();
    Object.keys(pack.localStorage||{}).forEach(function(key){
        if(githubSyncableLocalKey(key)){
            localStorage.setItem(key,String(pack.localStorage[key]));
        }
    });

    applySettings(loadSettings());
    state.current=null;
    state.playQueue=[];
    state.playIndex=0;
    state.isPlaying=false;
    if(window.speechSynthesis)speechSynthesis.cancel();
}

async function renderSystemInfo(){
    if(!$('systemInfoBox')){
        return;
    }

    var counts = {};

    for(var i=0;i<stores.length;i++){
        counts[stores[i]] = await getCount(stores[i]);
    }

    var summary = getStudySummary();
    var lastBackup = localStorage.getItem('chanlai_last_daily_backup') || '暂无';

    $('systemInfoBox').innerHTML =
    '<div class="kv">'+

        '<div><b>快照</b>'+(counts.snapshots||0)+'</div>'+
        '<div><b>最近每日备份</b>'+esc(lastBackup)+'</div>'+
        '<div><b>本周学习</b>'+summary.week.learn+'</div>'+
        '<div><b>本周阅读</b>'+summary.week.read+'</div>'+
        '<div><b>本周播放</b>'+summary.week.play+'</div>'+
        '<div><b>本月学习</b>'+summary.month.learn+'</div>'+
        '<div><b>累计学习</b>'+summary.total.learn+'</div>'+
    '</div>';

    var logs = getSystemLogs();

    var logHtml =
    '<div class="section" style="margin-top:16px">'+
    '<h3>最近操作日志</h3>'+
    '<div class="row" style="margin-bottom:10px">'+
        '<button class="btn small red" onclick="clearSystemLogs()">清空日志</button>'+
    '</div>';

    if(!logs.length){

        logHtml +=
        '<div class="notice">暂无日志</div>';

    }else{

        logHtml +=
        '<div class="table-wrap">'+
        '<table>'+
        '<thead>'+
        '<tr>'+
            '<th>时间</th>'+
            '<th>操作</th>'+
            '<th>详情</th>'+
        '</tr>'+
        '</thead>'+
        '<tbody>';

        logs.slice(0,30).forEach(function(x){

            var time = new Date(x.time)
            .toLocaleString();

            logHtml +=
            '<tr>'+
                '<td>'+time+'</td>'+
                '<td>'+esc(x.action||'')+'</td>'+
                '<td>'+esc(x.detail||'')+'</td>'+
            '</tr>';
        });

        logHtml +=
        '</tbody>'+
        '</table>'+

    }

    logHtml += '</div>';

    $('systemInfoBox').innerHTML += logHtml;

function setSettingsPanelValues(s){
    var ids = [
        'learningPath',
        'appearance',
        'fontSize',
        'defaultImportDupKey',
        'defaultImportDupAction',
        'autoBackup',
        'defaultReadMode',
        'quickAutoPlay',
        'quickStudyMode',
        'quickAutoShowCn',
        'quickAutoNext',
        'autoNextChapter',
        'autoSaveReadPosition',
        'debugMode',
        'quickAutoPlay'
    ];

    ids.forEach(function(id){
        if($(id) && s[id] !== undefined){
            $(id).value = s[id];
        }
    });
}
function renderVoiceSelect(cur){var sel=$('voiceName');if(!sel)return;state.voices=speechSynthesis.getVoices()||[];state.voices.forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name+'｜'+v.lang;sel.appendChild(o);});sel.value=cur||'';}
function collectSettings(){
    var s = loadSettings();

    [
        'learningPath',
        'themeColor',
        'bgColor',
        'appearance',
        'fontSize',
        'voiceName',
        'defaultImportDupKey',
        'defaultImportDupAction',
        'autoBackup',
        'defaultReadMode',
        'autoNextChapter',
        'autoSaveReadPosition',
        'debugMode',
        'quickAutoPlay',
        'quickStudyMode',
        'quickAutoShowCn',
        'quickAutoNext'
    ].forEach(function(id){
        if($(id)){
            s[id] = $(id).value;
        }
    });

    [
        'rate',
        'pitch',
        'volume',
        'pauseSeconds',
        'playLimit',
        'listWindowSize',
        'importPreviewLimit',
        'pageSizeSetting',
        'searchLimit',
        'homeListLimit',
        'reviewRefreshHour',
        'reviewDay1',
        'reviewDay2',
        'reviewDay3',
        'reviewDay4',
        'quickShowCnDelay',
        'quickNextDelay',
        'goalLearn',
        'goalRead',
        'goalPlay',
        'goalReview'
    ].forEach(function(id){
        if($(id)){
            s[id] = Number($(id).value);
        }
    });

    return s;
}
function previewSettings(){var s=collectSettings();localStorage.setItem(DRAFT_KEY,JSON.stringify(s));applySettings(s);}
function saveSettings(){var s=collectSettings();localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));localStorage.removeItem(DRAFT_KEY);applySettings(s);alert('设置已保存。');}
function loadVoices(){if(window.speechSynthesis)state.voices=speechSynthesis.getVoices()||[];}
function chooseVoice(){var s=loadSettings();if(s.voiceName){var v=state.voices.find(function(v){return v.name===s.voiceName;});if(v)return v;}return state.voices.find(function(v){return String(v.lang).toLowerCase().indexOf('pt-br')===0;})||state.voices.find(function(v){return String(v.lang).toLowerCase().indexOf('pt')===0;})||null;}
function speakPt(text){
    if(!window.speechSynthesis){
        alert('浏览器不支持发音');
        return;
    }

    speechSynthesis.cancel();

    var t = cleanPt(text);

    if(!t){
        return;
    }

    trackStudy('play');

    var u = new SpeechSynthesisUtterance(t);
    var s = loadSettings();
    var v = chooseVoice();

    if(v){
        u.voice = v;
    }

    u.lang = 'pt-BR';
    u.rate = s.rate;
    u.pitch = s.pitch;
    u.volume = s.volume;

    speechSynthesis.speak(u);
}
function speakPtAsync(text){return new Promise(function(resolve){if(!window.speechSynthesis){resolve();return;}var t=cleanPt(text);if(!t){resolve();return;}var u=new SpeechSynthesisUtterance(t),s=loadSettings(),v=chooseVoice();if(v)u.voice=v;u.lang='pt-BR';u.rate=s.rate;u.pitch=s.pitch;u.volume=s.volume;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);});}
function speakCnAsync(text){return new Promise(function(resolve){if(!window.speechSynthesis){resolve();return;}var t=cleanCn(text);if(!t){resolve();return;}var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=0.9;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);});}
function cleanPt(s){s=String(s||'').replace(/[\u4e00-\u9fff]/g,' ').replace(/\//g,' ').replace(/[【】\[\]{}#=_]/g,' ').replace(/\s+/g,' ').trim();return s;}
function cleanCn(s){return String(s||'').replace(/[^\u4e00-\u9fff，。！？、；：]/g,' ').replace(/\s+/g,' ').trim();}
function splitSentences(text){var s=String(text||'').replace(/\r/g,' ').replace(/\n/g,' '),parts=s.split(/([.!?。！？])/),arr=[];for(var i=0;i<parts.length;i+=2){var sent=(parts[i]||'').trim(),mark=(parts[i+1]||'').trim();if(sent)arr.push(sent+mark);}if(!arr.length&&s.trim())arr.push(s.trim());return arr;}
function moduleName(m){return{words:'单词表',phrases:'短语库',sentences:'句子库',stories:'故事库',novels:'小说库',review:'复习库'}[m]||m;}
function $(id){return document.getElementById(id);}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];});}function escAttr(s){return esc(s).replace(/"/g,'&quot;');}function debounce(fn,ms){var t;return function(){var self=this,args=arguments;clearTimeout(t);t=setTimeout(function(){fn.apply(self,args);},ms);};}function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function init(){
    await openDB();

    loadVoices();

    if(window.speechSynthesis){
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    applySettings(loadSettings());
    renderTabs();
    bindGlobal();

    await seedIfEmpty();
    await createDailyBackup();

    showPage('home');
}
init().catch(function(e){document.body.innerHTML='<pre style="padding:20px;color:red;white-space:pre-wrap">启动错误：\n'+e.message+'\n'+e.stack+'</pre>';});
})();
